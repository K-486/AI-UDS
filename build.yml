name: Build

on:
  push:
  pull_request:

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP engine tests (no JUCE)
        run: |
          g++ -std=c++17 -O2 tests/render_test.cpp -o render_test
          ./render_test

  plugin:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build plugin
        run: cmake --build build --config Release --parallel
      - name: Processor tests (Linux only)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target uds_processor_test --parallel
          ./build/uds_processor_test
      - uses: actions/upload-artifact@v4
        with:
          name: UDS4DrumSynth-${{ runner.os }}
          path: build/UDS4DrumSynth_artefacts/Release/
